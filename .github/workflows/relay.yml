name: zenodo-relay
on:
  workflow_dispatch:
    inputs:
      file:
        description: '文件名'
        required: true
        type: string
      url:
        description: '直接URL(留空=Zenodo记录内文件)'
        required: false
        type: string
        default: ''
      md5:
        description: '期望md5(留空=按文件名查Zenodo表, nocheck=跳过)'
        required: false
        type: string
        default: ''
permissions:
  contents: write
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - name: download-split-upload
        env:
          GH_TOKEN: ${{ github.token }}
          F: ${{ inputs.file }}
          URL_IN: ${{ inputs.url }}
          MD5_IN: ${{ inputs.md5 }}
        run: |
          set -euo pipefail
          BASE="https://zenodo.org/api/records/16362349/files"
          if [ -n "$URL_IN" ]; then URL="$URL_IN"; else URL="$BASE/$F/content"; fi
          if [ "$MD5_IN" = "nocheck" ]; then MD5=""; elif [ -n "$MD5_IN" ]; then MD5="$MD5_IN";
          else
            case "$F" in
              readme.pdf)                MD5=7a8d2c827ac6acfa94053c4a0ecee58c ;;
              species.zip)               MD5=fbba0a1819a8d1eddbc3b4af3d7f8676 ;;
              slice_culture.zip)         MD5=07240f4a8acc9f3f6941b8a9ec03bdf8 ;;
              myocardial_infarction.zip) MD5=43fba9d7f297eaa4cfd798478ce7157c ;;
              human.zip)                 MD5=64f7adf00cea4164372ee8bcd3a0023c ;;
              *) MD5="" ;;
            esac
          fi
          sudo mkdir -p /mnt/relay && sudo chown $(whoami) /mnt/relay && cd /mnt/relay
          REPO="SkylerWang1210/zenodo-relay"
          rm -f "$F".part-* "$F".md5stream
          echo "== $F from $URL (md5=${MD5:-none}) =="
          ok=0
          for i in $(seq 1 8); do
            rm -f "$F".part-*
            if curl -fL --retry 5 --retry-delay 20 --connect-timeout 30 --max-time 12000 \
                 -A "zenodo-relay-github-actions" "$URL" \
                 | tee >(md5sum > "$F.md5stream") \
                 | split -b 1900M -d -a 3 - "$F.part-"; then ok=1; break; fi
            echo "attempt $i failed, retrying"; sleep 45
          done
          [ "$ok" = 1 ] || { echo "DOWNLOAD FAILED"; exit 1; }
          SZ=$(cat "$F".part-* | wc -c)
          echo "streamed bytes: $SZ"
          if [ -n "$MD5" ]; then
            GOT=$(awk '{print $1}' "$F.md5stream")
            echo "got md5: $GOT / expect: $MD5"
            [ "$GOT" = "$MD5" ] || { echo "MD5 MISMATCH"; exit 1; }
          fi
          TAG="relay-$(echo "$F" | tr '.' '-' | tr '/' '-')"
          gh release create "$TAG" -R "$REPO" --title "$TAG" --notes "auto relay of $F" || true
          gh release upload "$TAG" -R "$REPO" "$F".part-* "$F".md5stream --clobber
          echo "RELAY-OK $F size=$SZ"
